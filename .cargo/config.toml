# Política de supply chain (Cargo 1.100): não resolver versões publicadas há menos de 7 dias.
# Vale só para resolução de registry; o Cargo.lock fixado continua autoritativo.
[registries.crates-io]
min-publish-age = "7 days"
# `unused_dependencies` está declarado uma única vez, em [lints.cargo] do
# Cargo.toml — duplicar aqui geraria aviso de config conflictual.
