[package]
name = "gitlab-wrapper-rs"
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
resolver = "2"
license = "MPL-2.0"
description = "Typed async Rust wrapper for the GitLab REST API v4"
repository = "https://github.com/st-all-one/gitlab-wrapper-rs"
keywords = ["gitlab", "api", "rest", "wrapper"]
categories = ["api-bindings"]

[lib]
name = "gitlab_wrapper"

[features]
default = ["rustls"]
rustls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
thiserror = "2"
tracing = { version = "0.1", features = ["log"] }
uuid = { version = "1", features = ["v7"] }
sha2 = "0.10"
getrandom = { version = "0.2", features = ["std"] }
tokio = { version = "1", features = ["time", "sync"] }
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "encoding"
harness = false

[lints.rust]
# `unsafe_code` já é `forbid` no crate root; manter aqui como contrato do manifesto.
unsafe_code = "deny"
missing_docs = "deny"
unused_qualifications = "deny"
elided_lifetimes_in_paths = "deny"
trivial_casts = "deny"
unused_import_braces = "deny"
variant_size_differences = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.cargo]
# Cargo 1.100: dependência declarada e nunca usada é erro de rigor.
unused_dependencies = "deny"

[lints.clippy]
# Grupos com prioridade menor para permitir ajustes pontuais.
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Restrição curada: produção rigorosa; testes legados são liberados via clippy.toml.
# `panic` não é habilitado: a suíte legada usa panic! em fixtures.
wildcard_imports = "deny"
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
mem_forget = "deny"
await_holding_lock = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
