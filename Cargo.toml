[package]
name = "gitlab-wrapper-rs"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Typed Rust wrapper for the GitLab REST API v4"
repository = "https://github.com/st-all-one/gitlab-wrapper-rs"
keywords = ["gitlab", "api", "rest", "wrapper"]
categories = ["api-bindings"]

[lib]
name = "gitlab_wrapper"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
uuid = { version = "1", features = ["v7"] }
sha2 = "0.10"

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
wiremock = "0.6"
