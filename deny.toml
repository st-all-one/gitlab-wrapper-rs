[advisories]
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"
notice = "warn"
ignore = []

[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "MPL-2.0",
    "ISC",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Unicode-3.0",
    "CC0-1.0",
]
default = "deny"

[bans]
multiple-versions = "warn"
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
