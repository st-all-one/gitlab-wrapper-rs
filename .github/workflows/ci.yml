name: CI

# Push em qualquer branch + PRs. O release (binários por plataforma) fica no
# `release.yml`, disparado por tag `v*`. Aqui só verificamos o estado do código.
on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  check:
    name: fmt + clippy + test (1.100)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: make check
      - run: cargo test --locked
      - name: Versão da crate coerente com Cargo.lock
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"] == "gitlab-wrapper-rs"))')"
          grep -q "version = \"${version}\"" Cargo.lock
          test "$(./target/debug/glw --version | awk '{print $NF}')" = "$version"
      - name: Release profile compila
        run: cargo build --release --locked --bin glw
